name: Windows Codex original-session probe
on:
  push:
    branches: [codex/windows-original-session-probe]
permissions:
  contents: read
jobs:
  native-codex:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official native Codex package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codex-package.tar.zst'
          curl.exe --fail --location --retry 2 --max-time 180 --output $archive 'https://github.com/openai/codex/releases/download/rust-v0.169.0/codex-package-x86_64-pc-windows-msvc.tar.zst'
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'eca09f840d7b53cdd67108a7c5c39457758b601340e697c6e609f645e82707eb') { throw 'Release checksum mismatch' }
          $package = Join-Path $env:RUNNER_TEMP 'codex-native'
          New-Item -ItemType Directory -Path $package | Out-Null
          python -m pip install --disable-pip-version-check zstandard==0.25.0 pywinpty==2.0.15
          if ($LASTEXITCODE -ne 0) { throw 'Zstandard setup failed' }
          python -c "import sys,tarfile,zstandard; src=open(sys.argv[1],'rb'); reader=zstandard.ZstdDecompressor().stream_reader(src); tarfile.open(fileobj=reader,mode='r|').extractall(sys.argv[2],filter='data')" $archive $package
          if ($LASTEXITCODE -ne 0) { throw 'Package extraction failed' }
          $binary = Get-ChildItem $package -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Missing codex.exe' }
          "PROBE_CODEX=$($binary.FullName)" >> $env:GITHUB_ENV
      - name: Probe original-session transport without production credentials
        shell: pwsh
        run: |
          python tools/probe_codex_original.py --codex "$env:PROBE_CODEX" --state "$env:RUNNER_TEMP/ras-native" --limited --tui
          exit $LASTEXITCODE
      - name: Probe managed Windows daemon with the same session checks
        if: success() || failure()
        shell: pwsh
        run: |
          python tools/probe_codex_original.py --codex "$env:PROBE_CODEX" --state "$env:RUNNER_TEMP/ras-managed" --limited --managed
          exit $LASTEXITCODE
